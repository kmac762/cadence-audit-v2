# OPTIONAL Blueprint. The browser-only manual setup is in START-HERE.html.
# Assumes the entire cadence-audit-v2 folder was uploaded to a NEW repository.
# This creates a separate PAID service. It does not connect your production domain.
services:
  - type: web
    name: cadence-audit-v2-staging
    runtime: docker
    plan: 1c-2g
    region: oregon
    rootDir: cadence-audit-v2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: ENABLE_RENDERING
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: cadence-v2-scan-data
      mountPath: /var/data
      sizeGB: 1
